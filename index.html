<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9b1c2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carnicería">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Control Carnicería</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Compatible con navegadores antiguos (Chrome 38+): sin variables CSS, sin grid y sin gap. */
*{box-sizing:border-box}
html{font-size:18px}
@media (min-width:1100px){html{font-size:20px}}
html,body{height:100%;margin:0}
body{background:#f3f4f6;color:#1c2127;font-family:'Barlow',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:1rem;line-height:1.4;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
h1,h2,h3{font-family:'Barlow Semi Condensed','Arial Narrow',Roboto,Arial,sans-serif;margin:0;letter-spacing:.01em}
h2{font-size:1.25rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.small{font-size:.85rem}
.muted{color:#5d6975}

header.top{display:flex;align-items:center;padding:10px 16px;background:#fff;border-bottom:1px solid #dde1e6}
header.top>*+*{margin-left:12px}
header.top h1{font-size:1.35rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;font-size:.8rem;font-weight:600;background:#f6e4e7;color:#9b1c2e}
.dot{width:8px;height:8px;border-radius:50%;background:#a85f00;margin-right:6px}
.dot.ok{background:#1f7a4d}
.banner{padding:8px 16px;font-size:.9rem;background:#fbeed6;color:#a85f00;border-bottom:1px solid #dde1e6}
.banner.bad{background:#f9dedc;color:#b3261e}

main#view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;width:100%;max-width:none;margin:0;display:flex;flex-direction:column}
main#view>*{flex-shrink:0}
main#view>*+*{margin-top:16px}
nav.tabs{display:flex;background:#fff;border-top:1px solid #dde1e6}
nav.tabs button{flex:1;min-width:0;border:0;background:none;padding:18px 4px;font-family:'Barlow Semi Condensed','Arial Narrow',Roboto,Arial,sans-serif;font-weight:600;font-size:1.02rem;color:#5d6975;border-top:3px solid transparent}
nav.tabs button[aria-current="page"]{color:#9b1c2e;border-top-color:#9b1c2e}
@media (max-width:520px){nav.tabs button{font-size:.88rem;padding:12px 2px}}

.panel{background:#fff;border:1px solid #dde1e6;border-radius:12px;padding:16px;display:flex;flex-direction:column;min-width:0}
.panel>*{flex-shrink:0}
.panel>*+*{margin-top:12px}
.panel>h2{display:flex;justify-content:space-between;align-items:baseline}
.panel>h2 span{margin-left:8px}
.row{display:flex;flex-wrap:wrap;margin:-6px}
.row>*{flex:1 1 180px;min-width:0;margin:6px}
label{display:block;font-size:.85rem;font-weight:600;color:#5d6975;margin-bottom:4px}
input,select,textarea{width:100%;padding:12px 14px;background:#f3f4f6;border:1px solid #dde1e6;border-radius:8px;min-height:50px}
textarea{min-height:76px;resize:vertical}
.field{min-width:0}
.primary,.ghost,.danger,.step,.chip{border-radius:8px;border:1px solid #dde1e6;padding:12px 18px;min-height:50px;font-weight:600}
.primary{background:#9b1c2e;color:#fff;border-color:#9b1c2e}
.primary:disabled{opacity:.45;cursor:not-allowed}
.primary.big{min-height:54px;font-size:1.1rem;font-family:'Barlow Semi Condensed','Arial Narrow',Roboto,Arial,sans-serif;letter-spacing:.02em}
.ghost{background:#fff}
.danger{background:#fff;color:#b3261e;border-color:#b3261e}
.link{background:none;border:0;color:#9b1c2e;padding:6px 8px;font-weight:600;min-height:36px}
.link.bad{color:#b3261e}
.swap{min-height:38px;padding:6px 12px;font-size:.85rem}
.chips{display:flex;overflow-x:auto;padding-bottom:2px}
.chips>*+*{margin-left:8px}
.chip{background:#fff;white-space:nowrap;padding:10px 18px;min-height:48px;flex-shrink:0}
.chip[aria-pressed="true"]{background:#9b1c2e;color:#fff;border-color:#9b1c2e}

/* Mostrador: productos a la izquierda (con su scroll) y ticket fijo y estrecho a la derecha */
main#view>.sell{flex:1 1 auto;flex-shrink:1;min-height:0}
.sell{display:flex;align-items:stretch}
.sell>section{flex:1 1 0%;min-width:0;overflow:hidden;margin-right:12px}
.sell>section>.grid{margin:6px -6px -6px;flex:1 1 0%;flex-shrink:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;align-content:flex-start}
.sell>aside{flex:0 0 280px;width:280px;min-width:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ticket .lines{flex:1 1 0%;flex-shrink:1;min-height:70px;overflow-y:auto}
.ticket .line{flex-wrap:wrap}
.ticket .line>*+*{margin-left:0}
.ticket .line .t{flex:1 1 100%}
.ticket .line>button{margin-left:auto}
.ticket .total{font-size:1.15rem}
.ticket .total strong{font-size:1.6rem}
.ticket .seg{display:block}
.ticket .seg button{display:block;width:100%;min-height:48px}
.ticket .seg button+button{margin:8px 0 0}
.ticket .primary.big{min-height:60px}
.ticket>.ghost,.ticket>.link{text-align:center}
@media (max-width:899px){.sell .grid>*{width:calc(50% - 12px)}}
@media (max-width:599px){
  main#view>.sell{flex:0 0 auto}
  .sell{display:block}
  .sell>section{overflow:visible;margin:0 0 16px}
  .sell>section>.grid{overflow:visible;flex:0 0 auto;margin:-6px}
  .sell>aside{width:auto;overflow:visible}
  .ticket .lines{overflow:visible}
}
.grid{display:flex;flex-wrap:wrap;margin:-6px}
.grid>*{margin:6px;width:calc(50% - 12px)}
@media (min-width:600px){.grid>*{width:calc(33.333% - 12px)}}
.grid>.empty{width:calc(100% - 12px)}
.prod{display:block;text-align:left;padding:16px 14px;min-height:112px;background:#f3f4f6;border:1px solid #dde1e6;border-radius:10px;border-left:5px solid #9b1c2e}
.prod.ud{border-left-color:#1f7a4d}
.prod b{display:block;font-family:'Barlow Semi Condensed','Arial Narrow',Roboto,Arial,sans-serif;font-size:1.3rem;line-height:1.15;margin-bottom:6px}
.prod span{display:block;color:#5d6975;font-size:1rem}
.lines{min-height:48px}
.line{display:flex;align-items:center;padding:10px 0;border-bottom:1px dashed #dde1e6}
.line>*+*{margin-left:8px}
.line .t{flex:1;min-width:0}
.line .t small{display:block;color:#5d6975}
.total{display:flex;justify-content:space-between;align-items:baseline;font-family:'Barlow Semi Condensed','Arial Narrow',Roboto,Arial,sans-serif;font-size:1.5rem}
.total strong{font-size:2rem}
.seg{display:flex}
.seg button{flex:1;background:#fff;border:1px solid #dde1e6;border-radius:8px;min-height:46px;font-weight:600}
.seg button+button{margin-left:8px}
.seg button[aria-pressed="true"]{background:#f6e4e7;border-color:#9b1c2e;color:#9b1c2e}
.empty{padding:20px;text-align:center;color:#5d6975;border:1px dashed #dde1e6;border-radius:10px}

.item{display:flex;align-items:center;padding:14px 0;border-bottom:1px solid #dde1e6}
.item>*+*{margin-left:10px}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0}
.item .t small{display:block;color:#5d6975}
.item.void{opacity:.6}
.item.void .amt{text-decoration:line-through}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.75rem;font-weight:600;background:#dde1e6;color:#5d6975}
.tag.ok{background:#dff1e7;color:#1f7a4d}
.tag.warn{background:#fbeed6;color:#a85f00}
.tag.bad{background:#f9dedc;color:#b3261e}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:1rem}
th,td{padding:12px 10px;border-bottom:1px solid #dde1e6;text-align:left;vertical-align:middle}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:#5d6975;font-weight:600}
td.n,th.n{text-align:right}
td input{min-width:90px;text-align:right}
.pos{color:#1f7a4d}.neg{color:#b3261e}.warnc{color:#a85f00}

.tiles{display:flex;flex-wrap:wrap;margin:-5px}
.tile{flex:1 1 200px;min-width:160px;margin:5px;background:#f3f4f6;border:1px solid #dde1e6;border-radius:10px;padding:12px}
.tile small{color:#5d6975;display:block}
.tile strong{font-family:'Barlow Semi Condensed','Arial Narrow',Roboto,Arial,sans-serif;font-size:1.6rem;display:block;line-height:1.15}
.tile.alert{border-color:#b3261e;background:#f9dedc}
.bar{display:flex;align-items:center;font-size:.9rem}
.bar+.bar{margin-top:6px}
.bar>span:first-child{width:56px;flex-shrink:0}
.bar .track{flex:1;height:18px;background:#f3f4f6;border-radius:4px;overflow:hidden;margin:0 8px}
.bar .fill{height:100%;background:#9b1c2e;border-radius:4px}
.bar .v{width:84px;flex-shrink:0;text-align:right}

.sheet{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(10,12,14,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
@media (min-width:640px){.sheet{align-items:center;padding:16px}}
.sheet-card{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px;display:flex;flex-direction:column;max-height:92%;overflow-y:auto}
.sheet-card>*{flex-shrink:0}
.sheet-card>*+*{margin-top:12px}
@media (min-width:640px){.sheet-card{border-radius:16px}}
.sheet-card header{display:flex;justify-content:space-between;align-items:center}
.sheet-card h3{font-size:1.3rem}
.sb>*+*{margin-top:12px}
.icon{border:0;background:none;font-size:1.8rem;line-height:1;padding:4px 10px;color:#5d6975}
.qtyrow{display:flex}
.qtyrow>*+*{margin-left:8px}
.qtyrow input{font-size:2.2rem;text-align:center;min-height:76px;flex:1;font-family:'Barlow Semi Condensed','Arial Narrow',Roboto,Arial,sans-serif}
.step{background:#fff;min-width:76px;font-size:1.8rem}
.linetotal{display:flex;justify-content:space-between;align-items:baseline;font-size:1.1rem}
.linetotal strong{font-family:'Barlow Semi Condensed','Arial Narrow',Roboto,Arial,sans-serif;font-size:1.8rem}
.toast{position:fixed;left:50%;bottom:84px;-webkit-transform:translateX(-50%);transform:translateX(-50%);background:#1c2127;color:#fff;padding:12px 18px;border-radius:10px;z-index:30;max-width:90%;font-weight:500}
.toast.bad{background:#b3261e;color:#fff}

/* Revisar */
.alert{border:1px solid #dde1e6;border-left:6px solid #b3261e;border-radius:10px;padding:14px 16px}
.alert+.alert{margin-top:12px}
.alert.done{border-left-color:#1f7a4d;opacity:.8}
.alert>*+*{margin-top:8px}
.ahead{display:flex;justify-content:space-between;align-items:center}
.ahead b{font-family:'Barlow Semi Condensed','Arial Narrow',Roboto,Arial,sans-serif;font-size:1.3rem;margin-right:12px}
.asub{color:#5d6975}
.alert p{margin:0}
.alert .ghost{border-color:#9b1c2e;color:#9b1c2e}
.badge{display:inline-block;min-width:22px;padding:1px 7px;margin-left:6px;border-radius:12px;background:#b3261e;color:#fff;font-size:.8rem;line-height:1.5}

/* teclado numérico */
.kp{position:fixed;left:0;right:0;bottom:0;height:270px;background:#e5e8ec;border-top:1px solid #c9ced4;padding:10px;z-index:30;display:-webkit-flex;display:flex;-webkit-justify-content:center;justify-content:center}
.kp[hidden]{display:none}
.kp-in{display:-webkit-flex;display:flex;width:100%;max-width:560px}
.kp-l{-webkit-flex:3 1 0;flex:3 1 0;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
.kp-r{-webkit-flex:1 1 0;flex:1 1 0;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;margin-left:8px}
.kp-row{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;margin-bottom:8px}
.kp-row button+button{margin-left:8px}
.kp button{-webkit-flex:1;flex:1;min-height:0;font-size:1.9rem;font-weight:600;background:#fff;border:1px solid #c9ced4;border-radius:10px;padding:0}
.kp button:active{background:#d5d9de}
.kp button:disabled{opacity:.35}
.kp-r button+button{margin-top:8px}
.kp button.ok{background:#9b1c2e;border-color:#9b1c2e;color:#fff}

body.kp-open main#view{padding-bottom:290px}
input.kp-on{border-color:#9b1c2e;box-shadow:0 0 0 3px rgba(155,28,46,.25)}

/* cambio al cobrar en efectivo */
.change{display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;-webkit-align-items:baseline;align-items:baseline;background:#f3f4f6;border:1px solid #dde1e6;border-radius:8px;padding:12px 14px}
.change strong{font-size:1.8rem}
.change.ok{background:#e6f4ea;border-color:#9fd3ae}
.change.low{background:#fdecea;border-color:#f0a8a0;color:#9b1c2e}
.sb{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
.sb>*{-webkit-flex-shrink:0;flex-shrink:0}
.sheet.kp-room{bottom:270px;padding:8px 16px}
.sheet.kp-room .sheet-card{max-height:100%;padding:12px 16px}
.sheet.kp-room .sheet-card>*+*{margin-top:8px}
.sheet.kp-room .sb>*+*{margin-top:8px}
.bigin{font-size:2rem;min-height:68px;text-align:center}
@media (max-height:760px){
  .kp{height:220px;padding:8px}
  .kp-row{margin-bottom:6px}.kp-row button+button{margin-left:6px}.kp-r{margin-left:6px}.kp-r button+button{margin-top:6px}
  .kp button{font-size:1.6rem}
  .sheet.kp-room{bottom:220px;padding:6px 16px}
  .sheet.kp-room .sheet-card{padding:10px 16px}
  .sheet.kp-room .sheet-card>*+*,.sheet.kp-room .sb>*+*{margin-top:6px}
  .sheet.kp-room h3{font-size:1.1rem}
  .sheet.kp-room .icon{min-height:36px}
  .sheet.kp-room .bigin,.sheet.kp-room .qtyrow input{font-size:1.7rem;min-height:54px}
  .sheet.kp-room .chip{min-height:40px;padding:6px 14px}
  .sheet.kp-room .change{padding:8px 12px}.sheet.kp-room .change strong,.sheet.kp-room .linetotal strong{font-size:1.4rem}
  .sheet.kp-room .primary.big{min-height:48px}
  .sheet.kp-room label{font-size:.8rem}
  body.kp-open main#view{padding-bottom:240px}
}
@media (max-height:620px){
  .kp{height:190px}
  .sheet.kp-room{bottom:190px}
  .sheet.kp-room .sheet-card{padding:8px 14px}
  .sheet.kp-room .bigin,.sheet.kp-room .qtyrow input{min-height:46px;font-size:1.5rem}
  .sheet.kp-room .chip{min-height:36px}
  .sheet.kp-room .primary.big{min-height:44px}
  .sheet.kp-room .sheet-card header{margin-bottom:-4px}
}
.kp button{line-height:1}
.kp-row,.kp-l,.kp-r,.kp-in{min-height:0}
@media (max-height:620px){.kp button{font-size:1.4rem}}
@media (max-height:560px){
  .kp{height:170px;padding:6px}
  .sheet.kp-room{bottom:170px;padding:4px 16px}
  .sheet.kp-room .sheet-card{padding:6px 14px}
  .sheet.kp-room .sheet-card>*+*,.sheet.kp-room .sb>*+*{margin-top:4px}
  .sheet.kp-room .bigin,.sheet.kp-room .qtyrow input{min-height:40px;font-size:1.4rem}
  .sheet.kp-room .chip{min-height:32px}
  .sheet.kp-room .primary.big{min-height:40px}
  .sheet.kp-room .change{padding:4px 12px}
}

/* devolución */
.vact{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-flex-shrink:0;flex-shrink:0}
.vact button{margin-left:12px;min-height:44px}
.refl{display:block;color:#9b1c2e}
.rlines{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
.rline{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between;padding:8px 0;border-bottom:1px solid #e5e8ec}
.rl{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-flex:1;flex:1;margin:0}
.rl input[type=checkbox]{width:26px;height:26px;min-height:0;margin:0 12px 0 0;-webkit-flex-shrink:0;flex-shrink:0}
.rl small{display:block;color:#5b6570}
.rqw{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
.rqw .rq{width:100px;text-align:right;min-height:46px}
.rqw em{margin-left:6px;font-style:normal;color:#5b6570;width:24px}

.rtop{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between}
.rtop p{margin:0;-webkit-flex:1;flex:1}.rtop button{margin-left:12px;min-height:44px;-webkit-flex-shrink:0;flex-shrink:0}
.rrow{display:-webkit-flex;display:flex}.rrow>.field{-webkit-flex:1;flex:1;min-width:0}.rrow>.field+.field{margin-left:10px}
.rlist .item{padding:10px 0}

.minirow{display:-webkit-flex;display:flex;-webkit-flex-shrink:0;flex-shrink:0}
.minirow button{-webkit-flex:1;flex:1;min-height:44px;padding:0 6px;font-size:.85rem;white-space:nowrap}
.minirow button+button{margin-left:6px}
.minirow button.bad{color:#9b1c2e}
.sell>aside{overflow-y:auto}
</style>
</head>
<body>
<header class="top">
  <h1>Control Carnicería</h1>
  <button class="ghost swap" id="swap" hidden></button>
  <span class="pill" id="role"><span class="dot" id="dot"></span><span id="roletxt">Conectando</span></span>
</header>
<div id="banner" class="banner" hidden></div>
<main id="view"></main>
<nav class="tabs" id="nav" aria-label="Secciones"></nav>
<div class="sheet" id="sheet" hidden></div>
<div id="toast" class="toast" hidden role="status"></div>
