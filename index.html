<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9b1c2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carnicería">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Control Carnicería</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout: cabecera fija, contenido con scroll, pestañas abajo. En pantalla ancha, catálogo a la izquierda y ticket a la derecha. */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --ink:#1c2127; --muted:#5d6975; --line:#dde1e6;
  --accent:#9b1c2e; --accent-ink:#ffffff; --accent-soft:#f6e4e7;
  --ok:#1f7a4d; --ok-soft:#dff1e7; --warn:#a85f00; --warn-soft:#fbeed6; --bad:#b3261e; --bad-soft:#f9dedc;
  --font-display:'Barlow Semi Condensed','Arial Narrow',sans-serif;
  --font-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14171a; --surface:#1d2226; --ink:#eceff2; --muted:#9aa6b2; --line:#2e353b;
    --accent:#d65a6c; --accent-ink:#1a0b0e; --accent-soft:#3a1a20;
    --ok:#52c48a; --ok-soft:#173326; --warn:#e3a54a; --warn-soft:#3a2b10; --bad:#f08a82; --bad-soft:#3d1c19;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14171a; --surface:#1d2226; --ink:#eceff2; --muted:#9aa6b2; --line:#2e353b;
  --accent:#d65a6c; --accent-ink:#1a0b0e; --accent-soft:#3a1a20;
  --ok:#52c48a; --ok-soft:#173326; --warn:#e3a54a; --warn-soft:#3a2b10; --bad:#f08a82; --bad-soft:#3d1c19;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.4;display:flex;flex-direction:column;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:1.25rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num,td.n,th.n{font-variant-numeric:tabular-nums}

header.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
header.top h1{font-size:1.35rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.dot.ok{background:var(--ok)}
.banner{padding:8px 16px;font-size:.9rem;background:var(--warn-soft);color:var(--warn);border-bottom:1px solid var(--line)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}

main#view{flex:1;overflow-y:auto;padding:16px;width:100%;max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
nav.tabs{display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;min-width:0;border:0;background:none;padding:14px 4px;font-family:var(--font-display);font-weight:600;font-size:1.02rem;color:var(--muted);border-top:3px solid transparent}
nav.tabs button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}

@media (max-width:520px){nav.tabs button{font-size:.88rem;padding:12px 2px}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel>h2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 140px;min-width:0}
label{display:block;font-size:.85rem;font-weight:600;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;padding:11px 12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;min-height:44px}
textarea{min-height:76px;resize:vertical}
.field{min-width:0}
.primary,.ghost,.danger,.step,.chip{border-radius:8px;border:1px solid var(--line);padding:10px 16px;min-height:44px;font-weight:600}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.primary.big{min-height:54px;font-size:1.1rem;font-family:var(--font-display);letter-spacing:.02em}
.ghost{background:var(--surface)}
.danger{background:var(--surface);color:var(--bad);border-color:var(--bad)}
.link{background:none;border:0;color:var(--accent);padding:6px 8px;font-weight:600;min-height:36px}
.link.bad{color:var(--bad)}
.swap{min-height:38px;padding:6px 12px;font-size:.85rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{background:var(--surface);white-space:nowrap;padding:8px 14px;min-height:40px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.sell{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
@media (min-width:860px){.sell{grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr)}.ticket{position:sticky;top:0}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.prod{display:flex;flex-direction:column;gap:2px;text-align:left;padding:12px;min-height:84px;background:var(--bg);border:1px solid var(--line);border-radius:10px;border-left:5px solid var(--accent)}
.prod.ud{border-left-color:var(--ok)}
.prod b{font-family:var(--font-display);font-size:1.1rem;line-height:1.15}
.prod span{color:var(--muted);font-size:.85rem}
.lines{display:flex;flex-direction:column;gap:6px;min-height:48px}
.line{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.line .t{flex:1;min-width:0}
.line .t small{display:block;color:var(--muted)}
.total{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--font-display);font-size:1.5rem}
.total strong{font-size:2rem}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:46px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}

.list{display:flex;flex-direction:column}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0}
.item .t small{display:block;color:var(--muted)}
.item.void{opacity:.6}
.item.void .amt{text-decoration:line-through}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.75rem;font-weight:600;background:var(--line);color:var(--muted)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right}
td input{min-width:90px;text-align:right}
.pos{color:var(--ok)} .neg{color:var(--bad)} .warnc{color:var(--warn)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
.tile small{color:var(--muted);display:block}
.tile strong{font-family:var(--font-display);font-size:1.6rem;display:block;line-height:1.15}
.tile.alert{border-color:var(--bad);background:var(--bad-soft)}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:76px 1fr 84px;gap:8px;align-items:center;font-size:.9rem}
.bar .track{height:18px;background:var(--bg);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:4px}
.bar .v{text-align:right}

.sheet{position:fixed;inset:0;background:rgba(10,12,14,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:0}
@media (min-width:640px){.sheet{align-items:center;padding:16px}}
.sheet-card{background:var(--surface);width:100%;max-width:460px;border-radius:16px 16px 0 0;padding:16px;display:flex;flex-direction:column;gap:12px;max-height:92%;overflow-y:auto}
@media (min-width:640px){.sheet-card{border-radius:16px}}
.sheet-card header{display:flex;justify-content:space-between;align-items:center}
.sheet-card h3{font-size:1.3rem}
.icon{border:0;background:none;font-size:1.8rem;line-height:1;padding:4px 10px;color:var(--muted)}
.qtyrow{display:flex;gap:8px}
.qtyrow input{font-size:1.8rem;text-align:center;min-height:60px;font-family:var(--font-display)}
.step{background:var(--surface);min-width:60px;font-size:1.6rem}
.linetotal{display:flex;justify-content:space-between;align-items:baseline;font-size:1.1rem}
.linetotal strong{font-family:var(--font-display);font-size:1.8rem}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;z-index:30;max-width:90%;font-weight:500}
.toast.bad{background:var(--bad);color:#fff}
@media (prefers-reduced-motion:no-preference){.toast{animation:in .18s ease-out}@keyframes in{from{opacity:0;transform:translate(-50%,8px)}}}
</style>
</head>
<body>
<header class="top">
  <h1>Control Carnicería</h1>
  <button class="ghost swap" id="swap" hidden></button>
  <span class="pill" id="role"><span class="dot" id="dot"></span><span id="roletxt">Conectando</span></span>
</header>
<div id="banner" class="banner" hidden></div>
<main id="view"></main>
<nav class="tabs" id="nav" aria-label="Secciones"></nav>
<div class="sheet" id="sheet" hidden></div>
<div id="toast" class="toast" hidden role="status"></div>

<script>
(async function(){
"use strict";
var $ = function(s,r){return (r||document).querySelector(s)};
var esc = function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var fmtEur = new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'});
var eur = function(n){return fmtEur.format(n||0)};
var qfmt = function(n,kind){
  n=n||0;
  if(kind==='kg'){return Math.abs(n)<1?new Intl.NumberFormat('es-ES',{maximumFractionDigits:0}).format(Math.round(n*1000))+' g':new Intl.NumberFormat('es-ES',{maximumFractionDigits:3}).format(n)+' kg'}
  return new Intl.NumberFormat('es-ES',{maximumFractionDigits:0}).format(n)+' ud';
};
var round2 = function(n){return Math.round((n+Number.EPSILON)*100)/100};
var dayOf = function(t){return new Date(t).toLocaleDateString('sv-SE')};
var today = function(){return dayOf(Date.now())};
var hhmm = function(t){return new Date(t).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})};
var dmy = function(d){var p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0]};
var parseNum = function(s){var v=parseFloat(String(s).replace(',','.'));return isFinite(v)?v:NaN};
var METHODS = {efectivo:'Efectivo',tarjeta:'Tarjeta',bizum:'Bizum'};

/* BALANZA: punto único de conexión. Hoy el peso se escribe a mano (modo 'manual').
   Cuando se conozca el modelo, aquí se cambia leerPeso() para devolver el peso real en kg
   y el botón "Leer balanza" aparece solo. Ninguna otra parte de la app cambia. */
var Balanza = { modo:'manual', leerPeso:function(){return Promise.resolve(null)} };

var S = {products:[],sales:[],closings:[],moves:[],orders:[],names:{},cart:[],method:'efectivo',cat:'Todos',range:7,boss:false,uid:null,canWrite:true,tab:'vender',loaded:{}};
/* Datos locales: se guardan en esta tablet (localStorage). Más adelante se cambiará por una base de datos en la nube sin tocar el resto de la app. */
var SEED=[['Chuletón de ternera','kg',24.9,'Vacuno'],['Entrecot de ternera','kg',22.5,'Vacuno'],['Carne picada mixta','kg',8.9,'Vacuno'],['Filetes de ternera','kg',16.5,'Vacuno'],['Lomo de cerdo','kg',9.5,'Cerdo'],['Costilla de cerdo','kg',6.9,'Cerdo'],['Panceta','kg',7.5,'Cerdo'],['Pechuga de pollo','kg',8.5,'Aves'],['Muslos de pollo','kg',4.9,'Aves'],['Pollo entero','ud',7.9,'Aves'],['Chorizo fresco','ud',3.2,'Embutidos'],['Morcilla','ud',2.8,'Embutidos'],['Jamón cocido','kg',14.9,'Embutidos'],['Huevos docena','ud',3.5,'Otros']];
var db = (function(){
  var KEY='carniceria.datos.v1', store={}, ls=[];
  try{store=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){store={}}
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){throw {code:'quota_exceeded'}}}
  function notify(){ls.slice().forEach(function(l){l()})}
  function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
  function clone(o){return JSON.parse(JSON.stringify(o))}
  function snap(name,q){
    var c=store[name]||{};
    var arr=Object.keys(c).map(function(id){return {id:id,d:c[id]}});
    if(q.f){arr.sort(function(a,b){var x=a.d[q.f],y=b.d[q.f],r=x<y?-1:(x>y?1:0);if(typeof x==='string'&&typeof y==='string')r=x.localeCompare(y,'es');return q.d==='desc'?-r:r})}
    if(q.n)arr=arr.slice(0,q.n);
    return {docs:arr.map(function(i){return {id:i.id,exists:true,data:function(){return i.d},metadata:{fromCache:false}}}),metadata:{fromCache:false}};
  }
  function col(name,q){q=q||{};return {
    orderBy:function(f,d){return col(name,{f:f,d:d,n:q.n})},
    limit:function(n){return col(name,{f:q.f,d:q.d,n:n})},
    doc:function(id){return dref(name+'/'+(id||newId()))},
    onSnapshot:function(next){var l=function(){next(snap(name,q))};ls.push(l);setTimeout(l,0);return function(){ls=ls.filter(function(x){return x!==l})}}
  }}
  function dref(path){
    var p=path.split('/'),c=p[0],id=p[1];
    return {
      set:function(d){store[c]=store[c]||{};store[c][id]=clone(d);persist();notify();return Promise.resolve()},
      update:function(d){if(!store[c]||!store[c][id])return Promise.reject({code:'invalid_argument'});Object.assign(store[c][id],clone(d));persist();notify();return Promise.resolve()},
      delete:function(){if(store[c])delete store[c][id];persist();notify();return Promise.resolve()}
    };
  }
  if(!store._seeded){
    store.products={};
    SEED.forEach(function(p,i){store.products['p'+(i+1<10?'0':'')+(i+1)]={name:p[0],kind:p[1],price:p[2],cat:p[3],ts:i+1}});
    store._seeded=true;persist();
  }
  return {collection:function(n){return col(n)},doc:dref,
    _export:function(){return clone(store)},
    _import:function(o){if(!o||typeof o!=='object'||Array.isArray(o))throw new Error('x');store=clone(o);persist();notify()},
    _clear:function(names){names.forEach(function(n){delete store[n]});persist();notify()}};
})();
var user = null;
S.boss = true;
Object.defineProperty(S,'uid',{get:function(){return S.mode}});
if(!S.canWrite){ var bn=$('#banner'); bn.hidden=false; bn.textContent='Tienes acceso solo de lectura: puedes ver los datos pero no registrar ventas.'; }

/* Dos pantallas: 'mostrador' (trabajador, rápida y a ciegas en caja e inventario) y 'jefe' (informes, stock, caja, productos). El jefe puede cambiar de una a otra. */
S.mode = 'mostrador';
var bv = function(){return S.boss && S.mode==='jefe'};
var nm = function(id){return id==='jefe'?'Jefe':'Mostrador'};
var prodById = function(id){return S.products.find(function(p){return p.id===id})};
var okSales = function(){return S.sales.filter(function(s){return !s.voided})};

/* ---------- Aviso, toasts, hojas ---------- */
var toastT;
function toast(msg,bad){var t=$('#toast');t.textContent=msg;t.className='toast'+(bad?' bad':'');t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},bad?4200:2400)}
function openSheet(title,body){
  var el=$('#sheet');
  el.innerHTML='<div class="sheet-card" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><header><h3>'+esc(title)+'</h3><button class="icon" data-close aria-label="Cerrar">×</button></header><div class="sb">'+body+'</div></div>';
  el.hidden=false;
  $('[data-close]',el).onclick=closeSheet;
  el.onclick=function(e){if(e.target===el)closeSheet()};
  return $('.sb',el);
}
function closeSheet(){var el=$('#sheet');el.hidden=true;el.innerHTML=''}
function confirmSheet(title,text,okLabel){
  return new Promise(function(res){
    var b=openSheet(title,'<p>'+esc(text)+'</p><div class="row"><button class="ghost" id="cn">Cancelar</button><button class="danger" id="cy">'+esc(okLabel||'Confirmar')+'</button></div>');
    $('#cn',b).onclick=function(){closeSheet();res(false)};
    $('#cy',b).onclick=function(){closeSheet();res(true)};
  });
}
async function save(fn,okMsg){
  try{ await fn(); if(okMsg) toast(okMsg); return true; }
  catch(e){ toast('No se pudo guardar'+(e&&e.code==='invalid_argument'?' (sin permiso de escritura)':'. Inténtalo otra vez')+'.',true); return false; }
}

/* ---------- Stock ---------- */
function stockOf(p){
  var mv=S.moves.filter(function(m){return m.pid===p.id}).sort(function(a,b){return a.ts-b.ts});
  var base=0,since=0,last=null;
  mv.forEach(function(m){if(m.type==='inventario'){base=m.qty;since=m.ts;last=m}});
  var q=base;
  mv.forEach(function(m){if(m.ts>since){if(m.type==='entrada')q+=m.qty;else if(m.type==='merma')q-=m.qty}});
  okSales().forEach(function(s){if(s.ts>since)(s.items||[]).forEach(function(it){if(it.pid===p.id)q-=it.qty})});
  return {q:round2(q*1000)/1000,last:last};
}

/* ---------- Pestañas ---------- */
var tabs = {};

tabs.vender = {label:'Vender',
mount:function(v){
  v.innerHTML='<div class="sell"><section class="panel"><h2>Productos</h2><input id="q" type="search" placeholder="Buscar producto" aria-label="Buscar producto" autocomplete="off"><div class="chips" id="cats"></div><div class="grid" id="grid"></div></section>'+
  '<aside class="panel ticket"><h2>Venta actual</h2><div class="lines" id="lines"></div><div class="total"><span>Total</span><strong class="num" id="tot"></strong></div>'+
  '<div class="seg" id="meth"></div><button class="primary big" id="cobrar">Cobrar</button><button class="ghost" id="vaciar">Vaciar venta</button><button class="link bad" id="anulult">Anular última venta</button></aside></div>';
  $('#q').oninput=function(){tabs.vender.update()};
  $('#cats').onclick=function(e){var b=e.target.closest('button');if(!b)return;S.cat=b.dataset.c;tabs.vender.update()};
  $('#grid').onclick=function(e){var b=e.target.closest('button[data-id]');if(!b)return;var p=prodById(b.dataset.id);if(p)pickQty(p)};
  $('#lines').onclick=function(e){var b=e.target.closest('button[data-i]');if(!b)return;S.cart.splice(+b.dataset.i,1);tabs.vender.update()};
  $('#meth').onclick=function(e){var b=e.target.closest('button');if(!b)return;S.method=b.dataset.m;tabs.vender.update()};
  $('#vaciar').onclick=function(){S.cart=[];tabs.vender.update()};
  $('#cobrar').onclick=cobrar;
  $('#anulult').onclick=function(){var l=lastSale();if(l)anular(l.id)};
},
update:function(){
  if(!$('#grid'))return;
  var cats=['Todos'].concat(Array.from(new Set(S.products.map(function(p){return p.cat||'Otros'}))).sort());
  if(cats.indexOf(S.cat)<0)S.cat='Todos';
  $('#cats').innerHTML=cats.map(function(c){return '<button class="chip" data-c="'+esc(c)+'" aria-pressed="'+(c===S.cat)+'">'+esc(c)+'</button>'}).join('');
  var q=$('#q').value.trim().toLowerCase();
  var list=S.products.filter(function(p){return (S.cat==='Todos'||(p.cat||'Otros')===S.cat)&&(!q||p.name.toLowerCase().indexOf(q)>=0)}).sort(function(a,b){return a.name.localeCompare(b.name,'es')});

function lastSale(){return S.sales.filter(function(s){return s.day===today()&&!s.voided}).sort(function(a,b){return b.ts-a.ts})[0]}

function pickQty(p){
  var kg=p.kind==='kg';
  var b=openSheet(p.name,'<p class="muted num">'+eur(p.price)+' / '+(kg?'kg':'ud')+'</p><div><label for="qty">'+(kg?'Peso en gramos':'Unidades')+'</label><div class="qtyrow">'+
    (kg?'':'<button class="step" data-d="-1" aria-label="Menos">−</button>')+
    '<input id="qty" inputmode="numeric" autocomplete="off" value="'+(kg?'':'1')+'" placeholder="'+(kg?'0':'1')+'">'+
    (kg?'':'<button class="step" data-d="1" aria-label="Más">+</button>')+'</div>'+
    (kg?'<div class="chips" style="margin-top:8px">'+[100,200,250,500,1000].map(function(g){return '<button class="chip qk" data-g="'+g+'">'+(g>=1000?'1 kg':g+' g')+'</button>'}).join('')+'</div>':'')+'</div>'+
    (kg&&Balanza.modo!=='manual'?'<button class="ghost" id="leer">Leer balanza</button>':'')+
    '<div class="linetotal"><span>Importe</span><strong class="num" id="lt">'+eur(0)+'</strong></div><button class="primary big" id="add">Añadir a la venta</button>');
  var inp=$('#qty',b);
  /* En kg se escribe en gramos enteros; se guarda en kg (200 g = 0,2). */
  function val(){var n=parseNum(inp.value);if(!isFinite(n)||n<=0||n%1!==0)return NaN;if(n>(kg?60000:999))return NaN;return kg?n/1000:n}
  function upd(){var n=val();$('#lt',b).textContent=eur(isNaN(n)?0:round2(n*p.price));$('#add',b).disabled=isNaN(n)}
  inp.oninput=upd;
  b.onclick=function(e){var k=e.target.closest('.qk');if(k){inp.value=k.dataset.g;upd();return}var s=e.target.closest('.step');if(!s)return;var n=parseNum(inp.value);n=(isFinite(n)?n:0)+(+s.dataset.d);if(n<1)n=1;inp.value=n;upd()};
  var leer=$('#leer',b); if(leer)leer.onclick=async function(){var w=await Balanza.leerPeso();if(w){inp.value=String(Math.round(w*1000));upd()}};
  function add(){var n=val();if(isNaN(n))return;S.cart.push({pid:p.id,name:p.name,kind:p.kind,qty:n,price:p.price,total:round2(n*p.price)});closeSheet();tabs.vender.update()}
  $('#add',b).onclick=add;
  inp.onkeydown=function(e){if(e.key==='Enter')add()};
  upd(); inp.focus();
}

  var inR=S.sales.filter(function(s){return s.day>=start});
  var ok=inR.filter(function(s){return !s.voided}),vd=inR.filter(function(s){return s.voided});
  var tot=round2(ok.reduce(function(a,s){return a+s.total},0)),vtot=round2(vd.reduce(function(a,s){return a+s.total},0));
  $('#tiles').innerHTML='<div class="tile"><small>Ventas</small><strong class="num">'+eur(tot)+'</strong></div><div class="tile"><small>Tickets</small><strong class="num">'+ok.length+'</strong></div><div class="tile"><small>Ticket medio</small><strong class="num">'+eur(ok.length?tot/ok.length:0)+'</strong></div><div class="tile '+(vd.length?'alert':'')+'"><small>Ventas anuladas</small><strong class="num">'+vd.length+' · '+eur(vtot)+'</strong></div>';
  var days=[];for(var i=S.range-1;i>=0;i--)days.push(dayOf(Date.now()-i*864e5));
  var per={};days.forEach(function(d){per[d]=0});ok.forEach(function(s){if(per[s.day]!=null)per[s.day]=round2(per[s.day]+s.total)});
  var mx=Math.max.apply(null,days.map(function(d){return per[d]}).concat([1]));
  $('#bars').innerHTML=days.map(function(d){return '<div class="bar"><span class="num">'+dmy(d).slice(0,5)+'</span><div class="track"><div class="fill" style="width:'+Math.round(per[d]/mx*100)+'%"></div></div><span class="v num">'+eur(per[d])+'</span></div>'}).join('');
  var al=[];
  S.closings.filter(function(c){return c.day>=start&&Math.abs(c.difTotal||0)>=0.5}).forEach(function(c){al.push({t:c.ts,h:'<b>Caja del '+dmy(c.day)+'</b> <span class="tag '+((c.difTotal||0)<0?'bad':'warn')+' num">'+((c.difTotal||0)>0?'+':'')+eur(c.difTotal)+'</span><small>Cierre de '+esc(nm(c.by))+'. Falta o sobra dinero respecto a las ventas registradas.</small>'})});
  vd.forEach(function(s){al.push({t:s.voidTs||s.ts,h:'<b>Venta anulada '+dmy(s.day)+' '+hhmm(s.ts)+'</b> <span class="tag bad num">'+eur(s.total)+'</span><small>Motivo: '+esc(s.voidReason||'—')+' · por '+esc(nm(s.voidBy||s.by))+'</small>'})});
  S.moves.filter(function(m){return m.type==='inventario'&&m.day>=start&&m.diff<0}).forEach(function(m){al.push({t:m.ts,h:'<b>Faltan '+esc(qfmt(-m.diff,m.kind))+' de '+esc(m.pname)+'</b> <span class="tag bad">Inventario '+dmy(m.day)+'</span><small>Debería haber '+esc(qfmt(m.expected,m.kind))+' y se contó '+esc(qfmt(m.qty,m.kind))+'.</small>'})});
  al.sort(function(a,b){return b.t-a.t});
  $('#alerts').innerHTML=al.length?al.map(function(a){return '<div class="item"><div class="t">'+a.h+'</div></div>'}).join(''):'<div class="empty">Nada raro en este periodo: cajas cuadradas, sin anulaciones ni faltas de stock.</div>';
  var bm={};ok.forEach(function(s){bm[s.method]=round2((bm[s.method]||0)+s.total)});
  $('#bymeth').innerHTML=Object.keys(METHODS).map(function(m){return '<div class="item"><div class="t">'+METHODS[m]+'</div><b class="num">'+eur(bm[m]||0)+'</b></div>'}).join('');
  var tp={};ok.forEach(function(s){(s.items||[]).forEach(function(it){var k=it.pid;tp[k]=tp[k]||{name:it.name,kind:it.kind,q:0,t:0};tp[k].q+=it.qty;tp[k].t=round2(tp[k].t+it.total)})});
  var tl=Object.keys(tp).map(function(k){return tp[k]}).sort(function(a,b){return b.t-a.t}).slice(0,10);
  $('#top').innerHTML=tl.length?tl.map(function(t){return '<tr><td>'+esc(t.name)+'</td><td class="n num">'+qfmt(t.q,t.kind)+'</td><td class="n num">'+eur(t.t)+'</td></tr>'}).join(''):'<tr><td colspan="3"><div class="empty">Sin ventas en este periodo.</div></td></tr>';
}};

/* ---- Productos (jefe) ---- */
tabs.productos = {label:'Productos',
mount:function(v){
  v.innerHTML='<section class="panel"><h2>Añadir producto</h2><div class="row"><div class="field" style="flex:2 1 200px"><label for="pn">Nombre</label><input id="pn" autocomplete="off" maxlength="50"></div><div class="field"><label for="pk">Se vende por</label><select id="pk"><option value="kg">Peso (kg)</option><option value="ud">Unidades</option></select></div><div class="field"><label for="pp">Precio (€)</label><input id="pp" inputmode="decimal" autocomplete="off" placeholder="0,00"></div><div class="field"><label for="pc">Categoría</label><input id="pc" list="cl" autocomplete="off" maxlength="30" placeholder="Vacuno, Cerdo..."><datalist id="cl"></datalist></div></div><button class="primary" id="pgo">Añadir producto</button></section>'+
  '<section class="panel"><h2>Precios <span class="small muted">Edita el precio y sale del campo para guardar</span></h2><div class="tablewrap"><table><thead><tr><th>Producto</th><th>Categoría</th><th>Por</th><th class="n">Precio</th><th></th></tr></thead><tbody id="plist"></tbody></table></div></section>'+
  '<section class="panel"><h2>Copia de seguridad</h2><p class="muted small">Los datos están guardados solo en esta tablet. Descarga una copia de vez en cuando.</p><div class="row"><button class="ghost" id="dl">Descargar copia</button><label class="ghost" style="display:flex;align-items:center;justify-content:center;cursor:pointer;margin:0;color:var(--ink);font-size:1rem">Cargar copia<input id="ul" type="file" accept="application/json,.json" hidden></label><button class="danger" id="clr">Borrar datos de prueba</button></div></section>';
  $('#dl').onclick=function(){var blob=new Blob([JSON.stringify(db._export())],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='carniceria-copia-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},2000)};
  $('#ul').onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{db._import(JSON.parse(r.result));toast('Copia cargada')}catch(x){toast('Archivo no válido',true)}};r.readAsText(f)};
  $('#clr').onclick=async function(){if(await confirmSheet('Borrar datos de prueba','Se borran ventas, cierres, movimientos y pedidos. Los productos se quedan.','Borrar')){db._clear(['sales','closings','moves','orders']);toast('Datos de prueba borrados')}};
  $('#pgo').onclick=async function(){
    var n=$('#pn').value.trim(),p=parseNum($('#pp').value);
    if(!n||isNaN(p)||p<0){toast('Pon nombre y precio.',true);return}
    var ok=await save(function(){return db.collection('products').doc().set({name:n,kind:$('#pk').value,price:round2(p),cat:$('#pc').value.trim()||'Otros',ts:Date.now()})},'Producto añadido');
    if(ok){$('#pn').value='';$('#pp').value=''}
  };
  $('#plist').onchange=function(e){var i=e.target.closest('input[data-id]');if(!i)return;var p=parseNum(i.value);if(isNaN(p)||p<0){toast('Precio no válido.',true);tabs.productos.update();return}save(function(){return db.doc('products/'+i.dataset.id).update({price:round2(p)})},'Precio actualizado')};
  $('#plist').onclick=async function(e){var b=e.target.closest('button[data-del]');if(!b)return;var p=prodById(b.dataset.del);if(await confirmSheet('Borrar producto','¿Borrar "'+(p?p.name:'')+'"? Las ventas ya hechas se conservan.','Borrar'))save(function(){return db.doc('products/'+b.dataset.del).delete()},'Producto borrado')};
},
update:function(){
  if(!$('#plist'))return;
  $('#cl').innerHTML=Array.from(new Set(S.products.map(function(p){return p.cat}))).map(function(c){return '<option value="'+esc(c)+'">'}).join('');
  if(document.activeElement&&document.activeElement.closest&&document.activeElement.closest('#plist'))return;
  var ps=S.products.slice().sort(function(a,b){return (a.cat||'').localeCompare(b.cat||'','es')||a.name.localeCompare(b.name,'es')});
  $('#plist').innerHTML=ps.length?ps.map(function(p){return '<tr><td>'+esc(p.name)+'</td><td>'+esc(p.cat||'')+'</td><td>'+(p.kind==='kg'?'kg':'ud')+'</td><td class="n"><input data-id="'+esc(p.id)+'" inputmode="decimal" value="'+String(p.price).replace('.',',')+'" aria-label="Precio de '+esc(p.name)+'"></td><td class="n"><button class="link bad" data-del="'+esc(p.id)+'">Borrar</button></td></tr>'}).join(''):'<tr><td colspan="5"><div class="empty">Sin productos todavía.</div></td></tr>';
}};

/* ---------- Navegación ---------- */
function tabList(){return bv()?['informes','ventas','stock','pedidos','caja','productos']:['vender','pedidos','stock','caja']}
var LBL_B={informes:'Informes',ventas:'Ventas',stock:'Stock',pedidos:'Pedidos',caja:'Caja',productos:'Productos'};
var LBL_W={vender:'Vender',pedidos:'Pedidos',stock:'Mercancía',caja:'Cerrar caja'};
function renderNav(){
  var L=bv()?LBL_B:LBL_W;
  $('#nav').innerHTML=tabList().map(function(t){return '<button data-t="'+t+'"'+(t===S.tab?' aria-current="page"':'')+'>'+L[t]+'</button>'}).join('');
  $('#roletxt').textContent=bv()?'Jefe':'Mostrador';
  var sw=$('#swap');sw.hidden=!S.boss;sw.textContent=bv()?'Pasar a mostrador':'Entrar como jefe';
}
function pinHash(p){var h=5381;for(var i=0;i<p.length;i++)h=((h<<5)+h+p.charCodeAt(i))|0;return 'h'+h}
function askPin(){
  return new Promise(function(res){
    var saved=null;try{saved=localStorage.getItem('carniceria.pin')}catch(e){}
    var b=openSheet(saved?'PIN de jefe':'Crea tu PIN de jefe','<p class="muted">'+(saved?'Escribe el PIN para entrar.':'Elige 4 cifras. Se pedirán cada vez que alguien quiera entrar como jefe.')+'</p><div><label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off"></div><p class="neg small" id="pe" hidden></p><button class="primary big" id="pok">'+(saved?'Entrar':'Guardar PIN')+'</button>');
    var inp=$('#pin',b),err=$('#pe',b);
    function ok(){
      var v=inp.value.trim();
      if(!/^\d{4}$/.test(v)){err.textContent='Son 4 cifras.';err.hidden=false;return}
      if(saved){if(pinHash(v)!==saved){err.textContent='PIN incorrecto.';err.hidden=false;inp.value='';return}}
      else{try{localStorage.setItem('carniceria.pin',pinHash(v))}catch(e){}}
      closeSheet();res(true);
    }
    $('#pok',b).onclick=ok;inp.onkeydown=function(e){if(e.key==='Enter')ok()};inp.focus();
  });
}
$('#swap').onclick=async function(){
  if(bv()){S.mode='mostrador';S.cart=[];go(tabList()[0]);return}
  if(await askPin()){S.mode='jefe';go(tabList()[0])}
};
function go(t){
  if(tabList().indexOf(t)<0)t=tabList()[0];
  S.tab=t;renderNav();
  var v=$('#view');v.innerHTML='';v.scrollTop=0;
  tabs[t].mount(v);tabs[t].update();
}
$('#nav').onclick=function(e){var b=e.target.closest('button[data-t]');if(b)go(b.dataset.t)};

var raf=0;
function scheduleUpdate(){
  if(raf)return;
  raf=requestAnimationFrame(function(){raf=0;if(tabs[S.tab]&&$('#view').firstChild)tabs[S.tab].update();resolveNames()});
}
async function resolveNames(){
  if(!user||!user.profiles)return;
  var ids=new Set();
  ['sales','closings','moves','orders'].forEach(function(k){S[k].forEach(function(r){if(r.by)ids.add(r.by);if(r.voidBy)ids.add(r.voidBy)})});
  var need=Array.from(ids).filter(function(i){return !(i in S.names)});
  if(!need.length)return;
  need.forEach(function(i){S.names[i]=''});
  try{var ps=await user.profiles(need);need.forEach(function(i){S.names[i]=(ps&&ps[i]&&ps[i].name)||''});scheduleUpdate()}catch(e){}
}

/* ---------- Datos en vivo ---------- */
var loadTimer=setTimeout(function(){var b=$('#banner');b.hidden=false;b.className='banner';b.textContent='No se puede conectar con los datos todavía. Lo que ves puede estar desactualizado.'},10000);
function markLoaded(k){
  S.loaded[k]=true;
  if(Object.keys(S.loaded).length>=5){clearTimeout(loadTimer);$('#dot').classList.add('ok');if(S.canWrite){$('#banner').hidden=true}}
}
function sub(key,q){
  q.onSnapshot(function(snap){
    S[key]=snap.docs.map(function(d){var o={};var x=d.data()||{};for(var k in x)o[k]=x[k];o.id=d.id;return o});
    if(!snap.metadata.fromCache)markLoaded(key);
    scheduleUpdate();
  },function(e){var b=$('#banner');b.hidden=false;b.className='banner bad';b.textContent='Se perdió la conexión con los datos ('+(e&&e.code||'error')+'). Recarga la página.'});
}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
go(tabList()[0]);
sub('products',db.collection('products').orderBy('name'));
sub('sales',db.collection('sales').orderBy('ts','desc').limit(1000));
sub('closings',db.collection('closings').orderBy('ts','desc').limit(120));
sub('moves',db.collection('moves').orderBy('ts','desc').limit(1000));
sub('orders',db.collection('orders').orderBy('ts','desc').limit(300));
})();
</script>
